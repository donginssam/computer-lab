name: Deploy to GitHub Pages

on:
  # main의 CI가 성공했을 때만 배포한다. workflow_run은 기본 브랜치에 있는
  # 워크플로 정의를 사용하므로, 이 파일이 main에 올라간 뒤부터 동작한다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # CI가 통과시킨 바로 그 커밋을 배포한다. 기본값은 기본 브랜치의 최신
      # 커밋이라, 그 사이 새 푸시가 있으면 검사하지 않은 커밋이 나갈 수 있다.
      - name: Check out the commit CI verified
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: pnpm build --base="${{ steps.pages.outputs.base_path }}/"

      - name: Verify PWA
        run: pnpm verify:pwa

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
