name: CI

on:
  # main 푸시는 deploy 워크플로가 이 파일을 job으로 호출하므로 여기서 제외한다.
  # 그래야 배포 커밋도 검사되면서 같은 커밋을 두 번 돌리지 않는다.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 같은 저장소의 브랜치는 push 이벤트로 이미 검사하므로, pull_request는
    # 포크에서 온 것만 실행해 같은 커밋을 두 번 돌리지 않는다.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # oxlint는 포매터가 아니라 포맷을 보지 않으므로 check가 둘을 함께 돌린다.
      - name: Lint and check formatting
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify PWA
        run: pnpm verify:pwa

      # 배포는 프로젝트 하위 경로로 빌드한다. manifest의 scope·start_url과 서비스
      # 워커 등록 경로는 --base를 따라가므로, 루트가 아닌 경로에서도 서로 맞는지
      # 같은 검사를 한 번 더 돌린다. GITHUB_REPOSITORY는 "owner/repo" 형식이다.
      - name: Build for the Pages subpath
        run: pnpm build --base="/${GITHUB_REPOSITORY#*/}/"

      - name: Verify PWA on the subpath build
        run: pnpm verify:pwa
